<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Access</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #050505;
            color: #00ff66;

            font-family: "Courier New", monospace;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            overflow: hidden;
        }

        /* Subtle terminal scan lines */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background: repeating-linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.025) 0px,
                rgba(255, 255, 255, 0.025) 1px,
                transparent 1px,
                transparent 4px
            );

            pointer-events: none;
        }

        /* Moving scan line */
        body::after {
            content: "";

            position: fixed;
            left: 0;
            right: 0;
            top: -10%;

            height: 2px;

            background: rgba(0, 255, 102, 0.25);
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.35);

            animation: scan 3s linear infinite;

            pointer-events: none;
        }

        #terminal {
            width: 100%;
            max-width: 700px;

            font-size: 18px;
            line-height: 1.8;

            text-shadow: 0 0 8px rgba(0, 255, 102, 0.5);

            position: relative;
            z-index: 1;
        }

        #terminal p {
            margin: 0;

            opacity: 0;

            animation: appear 0.2s ease forwards;
        }

        /* Blinking terminal cursor */
        #terminal::after {
            content: "█";

            display: inline-block;

            margin-top: 4px;

            animation: blink 0.8s steps(1) infinite;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateX(-5px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes blink {
            0%, 50% {
                opacity: 1;
            }

            51%, 100% {
                opacity: 0;
            }
        }

        @keyframes scan {
            from {
                top: -10%;
            }

            to {
                top: 110%;
            }
        }

        @media (max-width: 600px) {
            #terminal {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div id="terminal"></div>

    <script>
        const messages = [
            "> NFC DEVICE DETECTED",
            "> READING TAG...",
            "> VERIFYING ACCESS...",
            "> ACCESS GRANTED"
        ];

        const terminal = document.getElementById("terminal");

        let index = 0;

        function nextMessage() {
            if (index < messages.length) {

                const line = document.createElement("p");
                line.textContent = messages[index];

                terminal.appendChild(line);

                index++;

                setTimeout(nextMessage, 400);
            }
        }

        nextMessage();

        setTimeout(() => {
            window.location.href = "/";
        }, 2200);
        
    </script>

</body>
</html>
